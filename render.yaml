databases:
  - name: sparrow-db
    databaseName: sparrow_os
    user: sparrow_admin
    plan: free
    region: ohio

services:
  - type: web
    name: sparrow-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: ohio
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sparrow-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: sparrow-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: sparrow-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: sparrow-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: sparrow-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: sparrow-db
          property: password
      - key: GEMINI_API_KEY
        sync: false
